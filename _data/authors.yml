# The primary author of this blog.
# Must be the same as `author` in `_config.yml`.
# Change `author1` to your shortname.
author1:
  name:              Emma Andrews
  email:             e.andrews@ufl.edu

  # Used at the bottom of each page and at the top of the `about` layout
  # Markdown enabled, can use multiple paragraphs (enabled by `|`)
  about:             |
    Emma Andrews received her Ph.D. in 2026, her M.S. in 2023, and her B.S. in 2021 from the Department of Computer and Information Science and Engineering at the University of Florida. Her area of research includes quantum computing, machine learning, verification, and tensor decompositions. 

  # This photo will be used in the about section
  picture:           /assets/img/pf.jpg

